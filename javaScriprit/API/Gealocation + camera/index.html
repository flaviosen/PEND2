<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation e Câmera</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Geolocation e Câmera</h1>

    <!-- LOCALIZAÇÃO -->
    <section>
        <h2>Minha Localização</h2>

        <button onclick="obterLocalizacao()">
            Obter Localização
        </button>

        <p id="latitude">Latitude: --</p>
        <p id="longitude">Longitude: --</p>
        <p id="precisao">Precisão: --</p>
    </section>

    <!-- CÂMERA -->
    <section>
        <h2>Câmera</h2>

        <video id="camera" autoplay></video>

        <br>

        <button onclick="tirarFoto()">
            Tirar Foto
        </button>

        <h3>Foto tirada:</h3>

        <canvas id="foto"></canvas>
    </section>

    <script src="script.js"></script>

</body>
</html>
